<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World of Sugandh — Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #1f2f37;
  --ink-soft: #3a5160;
  --ink-muted: #7a9aaa;
  --ink-faint: #b8ced8;
  --surface: #ffffff;
  --surface-2: #f5f7f8;
  --surface-3: #edf1f3;
  --accent: #c8a96e;
}

body {
  font-family: 'Jost', sans-serif;
  background: #e8ecee;
  min-height: 100vh;
}

/* ── Toggle Button ── */
#wosToggle {
  position: fixed;
  bottom: 28px;
  right: 28px;
  z-index: 9999;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: var(--ink);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(31,47,55,0.35);
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

#wosToggle:hover {
  transform: scale(1.08);
  box-shadow: 0 8px 28px rgba(31,47,55,0.4);
}

#wosToggle:active { transform: scale(0.94); }

.wos-icon {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
}

.wos-icon-chat  { opacity: 1; transform: scale(1) rotate(0deg); }
.wos-icon-close { opacity: 0; transform: scale(0.4) rotate(-80deg); }

#wosToggle.open .wos-icon-chat  { opacity: 0; transform: scale(0.4) rotate(80deg); }
#wosToggle.open .wos-icon-close { opacity: 1; transform: scale(1) rotate(0deg); }

.wos-badge {
  position: absolute;
  top: 3px; right: 3px;
  width: 13px; height: 13px;
  background: var(--accent);
  border-radius: 50%;
  border: 2px solid #e8ecee;
  animation: badgePop 0.4s cubic-bezier(0.34,1.56,0.64,1) 1.2s both;
}

@keyframes badgePop {
  from { transform: scale(0); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

/* ── Chat Window — desktop ── */
#wosWindow {
  position: fixed;
  bottom: 100px;
  right: 28px;
  z-index: 9998;
  width: 360px;
  height: 540px;
  background: var(--surface);
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(31,47,55,0.2), 0 0 0 1px rgba(31,47,55,0.07);

  /* closed */
  opacity: 0;
  pointer-events: none;
  transform: translateY(16px) scale(0.97);
  transform-origin: bottom right;
  transition:
    opacity 0.3s cubic-bezier(0.4,0,0.2,1),
    transform 0.3s cubic-bezier(0.34,1.4,0.64,1);
}

#wosWindow.open {
  opacity: 1;
  pointer-events: all;
  transform: translateY(0) scale(1);
}

/* ── Header ── */
.wos-header {
  background: var(--ink);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.wos-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: 1.5px solid rgba(255,255,255,0.14);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
}

.wos-online {
  position: absolute;
  bottom: 1px; right: 1px;
  width: 9px; height: 9px;
  background: #5cd4a0;
  border-radius: 50%;
  border: 2px solid var(--ink);
}

.wos-header-info { flex: 1; min-width: 0; }

.wos-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  font-weight: 500;
  color: #fff;
  letter-spacing: 0.04em;
  line-height: 1.2;
}

.wos-status {
  font-size: 11px;
  color: rgba(255,255,255,0.48);
  font-weight: 300;
  margin-top: 3px;
}

.wos-x {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  width: 30px; height: 30px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}

.wos-x:hover { background: rgba(255,255,255,0.16); }
.wos-x svg { stroke: rgba(255,255,255,0.65); fill: none; stroke-width: 2; stroke-linecap: round; }

/* ── Messages ── */
.wos-msgs {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  min-height: 0; /* critical — prevents flex child from overflowing */
}

.wos-msgs::-webkit-scrollbar { width: 3px; }
.wos-msgs::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 2px; }

.wos-msg {
  display: flex;
  flex-direction: column;
  max-width: 82%;
  animation: slideUp 0.28s cubic-bezier(0.34,1.2,0.64,1) both;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.wos-msg.bot  { align-self: flex-start; }
.wos-msg.user { align-self: flex-end; }

.wos-bubble {
  padding: 10px 13px;
  border-radius: 15px;
  font-size: 13px;
  line-height: 1.65;
  font-weight: 300;
}

.wos-msg.bot .wos-bubble {
  background: var(--surface-2);
  color: var(--ink);
  border-bottom-left-radius: 4px;
  border: 1px solid var(--surface-3);
}

.wos-msg.user .wos-bubble {
  background: var(--ink);
  color: #fff;
  border-bottom-right-radius: 4px;
}

.wos-t {
  font-size: 10px;
  color: var(--ink-faint);
  margin-top: 3px;
  padding: 0 3px;
  font-weight: 300;
}

.wos-msg.user .wos-t { text-align: right; }

/* ── Typing ── */
.wos-typing {
  align-self: flex-start;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--surface-3);
  border-radius: 15px;
  border-bottom-left-radius: 4px;
  animation: slideUp 0.28s cubic-bezier(0.34,1.2,0.64,1) both;
}

.wos-typing span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--ink-faint);
  animation: dot 1.2s ease-in-out infinite;
}

.wos-typing span:nth-child(2) { animation-delay: 0.15s; }
.wos-typing span:nth-child(3) { animation-delay: 0.30s; }

@keyframes dot {
  0%,60%,100% { transform: translateY(0); background: var(--ink-faint); }
  30% { transform: translateY(-5px); background: var(--ink-muted); }
}

/* ── Chips ── */
.wos-chips {
  padding: 0 14px 10px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  flex-shrink: 0;
}

.wos-chip {
  font-size: 11px;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--ink-faint);
  background: transparent;
  color: var(--ink-soft);
  cursor: pointer;
  font-family: 'Jost', sans-serif;
  font-weight: 400;
  letter-spacing: 0.02em;
  transition: all 0.18s ease;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}

.wos-chip:hover, .wos-chip:active {
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}

/* ── Input ── */
.wos-foot {
  padding: 10px 14px 14px;
  border-top: 1px solid var(--surface-3);
  background: var(--surface);
  flex-shrink: 0;
}

.wos-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--surface-2);
  border: 1px solid var(--surface-3);
  border-radius: 13px;
  padding: 9px 12px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.wos-row:focus-within {
  border-color: rgba(31,47,55,0.3);
  box-shadow: 0 0 0 3px rgba(31,47,55,0.06);
}

.wos-input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  font-family: 'Jost', sans-serif;
  font-size: 13px;
  font-weight: 300;
  color: var(--ink);
  resize: none;
  max-height: 80px;
  line-height: 1.5;
  overflow-y: auto;
  -webkit-appearance: none;
}

.wos-input::placeholder { color: var(--ink-faint); }

.wos-send {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--ink);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
  -webkit-tap-highlight-color: transparent;
}

.wos-send:hover { background: var(--ink-soft); transform: scale(1.08); }
.wos-send:active { transform: scale(0.92); }
.wos-send:disabled { background: var(--ink-faint); cursor: not-allowed; transform: none; }
.wos-send svg { width: 13px; height: 13px; fill: #fff; margin-left: 1px; }

.wos-credit {
  text-align: center;
  font-size: 10px;
  color: var(--ink-faint);
  margin-top: 8px;
  letter-spacing: 0.04em;
  font-weight: 300;
}

/* ── Mobile ── */
@media (max-width: 600px) {
  #wosToggle {
    bottom: 16px;
    right: 14px;
    width: 48px;
    height: 48px;
  }

  #wosWindow {
    position: fixed;
    /* sits above toggle, keyboard won't push it */
    bottom: 74px;
    right: 12px;
    left: 12px;
    top: auto;
    width: auto;
    max-width: 100%;
    height: 400px;
    max-height: calc(100vh - 110px);
    border-radius: 18px;
    transform-origin: bottom right;
    transform: translateY(16px) scale(0.96);
    transition:
      opacity 0.3s cubic-bezier(0.4,0,0.2,1),
      transform 0.3s cubic-bezier(0.34,1.4,0.64,1);
  }

  #wosWindow.open {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  .wos-bubble { font-size: 13px; }
  .wos-input  { font-size: 16px; }
  .wos-msgs   { padding: 12px; }
  .wos-chips  { padding: 0 12px 8px; }
  .wos-foot   { padding: 8px 12px 12px; }
}
</style>
</head>
<body>



<button id="wosToggle" aria-label="Open chat">
  <span class="wos-icon wos-icon-chat">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
      <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
    </svg>
  </span>
  <span class="wos-icon wos-icon-close">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </span>
  <div class="wos-badge" id="wosBadge" aria-hidden="true"></div>
</button>

<div id="wosWindow" role="dialog" aria-label="World of Sugandh chat" aria-modal="true">

  <div class="wos-header">
    <div class="wos-avatar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <div class="wos-online"></div>
    </div>
    <div class="wos-header-info">
      <div class="wos-name">World of Sugandh</div>
      <div class="wos-status">Style assistant &middot; Online</div>
    </div>
    <button class="wos-x" id="wosClose" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="wos-msgs" id="wosMsgs">
    <div class="wos-msg bot">
      <div class="wos-bubble">Hello! Welcome to World of Sugandh. I'm your style assistant — here to help you find the perfect piece. What are you looking for today?</div>
      <div class="wos-t">Just now</div>
    </div>
  </div>

  <div class="wos-chips" id="wosChips">
    <button class="wos-chip">New arrivals</button>
    <button class="wos-chip">Size guide</button>
    <button class="wos-chip">Shipping</button>
    <button class="wos-chip">Returns</button>
  </div>

  <div class="wos-foot">
    <div class="wos-row">
      <textarea class="wos-input" id="wosInput" rows="1" placeholder="Ask about styles, sizes, orders…" aria-label="Message"></textarea>
      <button class="wos-send" id="wosSend" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="wos-credit">World of Sugandh &middot; AI Style Assistant</div>
  </div>
</div>

<script>
(function () {
  const BACKEND_URL = 'https://wos-chatbot-backend.onrender.com';

  const sid = 'wos-' + Math.random().toString(36).substr(2, 9);
  let open = false;
  let busy = false;

  const toggle  = document.getElementById('wosToggle');
  const win     = document.getElementById('wosWindow');
  const closeX  = document.getElementById('wosClose');
  const input   = document.getElementById('wosInput');
  const send    = document.getElementById('wosSend');
  const msgs    = document.getElementById('wosMsgs');
  const chips   = document.getElementById('wosChips');
  const badge   = document.getElementById('wosBadge');

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function openChat() {
    open = true;
    win.classList.add('open');
    toggle.classList.add('open');
    if (badge) badge.style.display = 'none';
    setTimeout(() => input.focus(), 320);
  }

  function closeChat() {
    open = false;
    win.classList.remove('open');
    toggle.classList.remove('open');
  }

  toggle.addEventListener('click', () => open ? closeChat() : openChat());
  closeX.addEventListener('click', closeChat);

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) closeChat(); });

  // Close on outside tap (mobile-safe)
  document.addEventListener('touchstart', e => {
    if (open && !win.contains(e.target) && !toggle.contains(e.target)) closeChat();
  }, { passive: true });

  document.addEventListener('click', e => {
    if (open && !win.contains(e.target) && !toggle.contains(e.target)) closeChat();
  });

  function addMsg(text, role) {
    const d = document.createElement('div');
    d.className = 'wos-msg ' + role;
    const safe = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    d.innerHTML = '<div class="wos-bubble">' + safe + '</div><div class="wos-t">' + now() + '</div>';
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showDots() {
    const d = document.createElement('div');
    d.className = 'wos-typing'; d.id = 'wosDots';
    d.innerHTML = '<span></span><span></span><span></span>';
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideDots() {
    const d = document.getElementById('wosDots');
    if (d) d.remove();
  }

  async function sendMsg(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true;
    send.disabled = true;
    chips.style.display = 'none';
    addMsg(text, 'user');
    input.value = '';
    input.style.height = 'auto';
    showDots();

    try {
      const r = await fetch(BACKEND_URL + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId: sid })
      });
      if (!r.ok) throw new Error();
      const data = await r.json();
      hideDots();
      addMsg(data.reply || 'Sorry, no response. Try again.', 'bot');
    } catch {
      hideDots();
      addMsg('Something went wrong. Please try again.', 'bot');
    }

    busy = false;
    send.disabled = false;
    input.focus();
  }

  chips.querySelectorAll('.wos-chip').forEach(c => {
    c.addEventListener('click', () => sendMsg(c.textContent.trim()));
  });

  send.addEventListener('click', () => sendMsg(input.value));

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(input.value); }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 80) + 'px';
  });
})();
</script>

<!-- WIDGET END -->

</body>
</html>
